services:
  goapp:
    container_name: goapp
    image: goapp:1.0.0
    build:
      context: ./backend
      dockerfile: go.dockerfile
    environment:
      DATABASE_URL: "postgres://postgres:Postgres123@db:5432/postgresdb?sslmode=disable"
    ports:
      - "8080:8000"
    depends_on:
      - db
    restart: on-failure

  db:
    container_name: db
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Postgres123
      - POSTGRES_DB=postgresdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: {}
